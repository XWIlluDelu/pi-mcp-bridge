name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Prepare external test Pi
        run: |
          npm install --prefix "$RUNNER_TEMP/test-pi" --no-save @earendil-works/pi-coding-agent@1.4.0
          echo "$RUNNER_TEMP/test-pi/node_modules/.bin" >> "$GITHUB_PATH"
          echo "BRIDGE_TEST_PI_CLI=$RUNNER_TEMP/test-pi/node_modules/.bin/pi" >> "$GITHUB_ENV"
      - run: npm run format:check
      - run: npm test
